name: Vero Software
description: >-
  Vero Software is a developer of CAD/CAM software for manufacturing,
  headquartered in the United Kingdom and part of Hexagon's Manufacturing
  Intelligence division (Production Software). Its portfolio spans
  computer-aided manufacturing across metalworking, sheet metal, stone, and
  woodworking, with long-established desktop applications such as Alphacam,
  Cabinet Vision, Edgecam, Radan, SURFCAM, VISI, WorkNC, WorkXplore, Machining
  STRATEGIST, and PEPS. These are primarily installed engineering and CNC
  programming products rather than web services; as of this enrichment pass the
  company does not publish a public web API, developer portal, or SDK, and the
  verosoftware.com domain now redirects to Hexagon Manufacturing Intelligence
  marketing. Surfaced as a portfolio company of Battery Ventures and profiled in
  the API Evangelist network.
